# Example configuration for arey app
#
# Looked up from XDG_CONFIG_DIR (~/.config/arey/arey.yml) on Linux or
# ~/.arey on Windows.
#

# Reusable model configurations
# For <=3B models: max out GPU and CPU threads.
max_gpu: &max_gpu
  n_threads: 11
  n_gpu_layers: 99
  n_batch: 1024
  n_ubatch: 512
  flash_attention: true

# For ~7B models
big_gpu: &big_gpu
  n_threads: 11
  n_gpu_layers: 20
  n_batch: 1024
  n_ubatch: 512
  flash_attention: true

# For ~9B models
med_gpu: &med_gpu
  n_threads: 11
  n_gpu_layers: 16
  flash_attention: true

# For ~13B models
small_gpu: &small_gpu
  n_threads: 11
  n_gpu_layers: 14
  flash_attention: true

# Ordered by local, size and favorites within same size segment
models:
  lfm2.5-1.2b:
    <<: *max_gpu
    path: ~/docs/models/lfm/LFM2.5-1.2B-Instruct-UD-Q8_K_XL.gguf
    type: gguf
    n_ctx: 8192
  minicpm5-2b:
    <<: *max_gpu
    path: ~/docs/models/minicpm/Sharp-MiniCPM5-2B-Q4_K_S.gguf
    type: gguf
    n_ctx: 16084
  qwen-2b:
    <<: *max_gpu
    path: ~/docs/models/qwen/Qwen_Qwen3.5-2B-Q6_K_L.gguf
    type: gguf
    n_ctx: 8192
    template: qwen35
  spark-4b:
    <<: *max_gpu
    path: ~/docs/models/spark/Spark-X2.6-4B-Q5_K_M.gguf
    type: gguf
    n_ctx: 4096
  neohorse-4b:
    <<: *max_gpu
    path: ~/docs/models/neohorse/NeoHorse-1-4B-Q4_K_M.gguf
    type: gguf
    n_ctx: 16084
  qwen-4b:
    <<: *max_gpu
    path: ~/docs/models/qwen/Qwen_Qwen3.5-4B-Q4_K_L.gguf
    type: gguf
    n_ctx: 8192
    template: qwen35
  qwen-9b:
    <<: *med_gpu
    path: ~/docs/models/qwen/Qwen_Qwen3.5-9B-Q4_K_M.gguf
    type: gguf
    n_ctx: 8192
    template: qwen35
  gemma2-9b-atarax:
    <<: *med_gpu
    path: ~/docs/models/gemma-2/Gemma-2-Ataraxy-9B-Q4_K_L.gguf
    type: gguf
  gemma2-9b-it-sppo-iter3:
    <<: *med_gpu
    path: ~/docs/models/gemma-2/Gemma-2-9B-It-SPPO-Iter3-Q4_K_L.gguf
    type: gguf
  gemma2-9b-it:
    <<: *med_gpu
    path: ~/docs/models/gemma-2/gemma-2-9b-it-Q4_K_L.gguf
    type: gguf
  llamacpp-server:
    name: gemma2-9b-it-sppo-iter3
    type: openai
    base_url: "http://localhost:8080"
  # Hosted models, may not respect privacy and use data for training.
  qwen3-235b:
    name: qwen-3-235b-a22b-instruct-2507
    type: openai
    base_url: https://api.cerebras.ai/v1
    api_key: env:CEREBRAS_API_KEY
    n_ctx: 65536
  gemini-pro:
    name: gemini-3-pro-preview
    type: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key: env:GEMINI_API_KEY
    n_ctx: 1048576
  gemini-flash:
    name: gemini-3-flash-preview
    type: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key: env:GEMINI_API_KEY
    n_ctx: 1048576
  gemini-flash-lite:
    name: gemini-2.5-flash-lite
    type: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key: env:GEMINI_API_KEY
    n_ctx: 1048576
  or-elephant:
    name: openrouter/elephant-alpha
    type: openai
    base_url: https://openrouter.ai/api/v1
    api_key: env:OPENROUTER_API_KEY
    n_ctx: 2621024

profiles:
  zero:
    # factual responses and straightforward assistant answers
    temperature: 0
    repeat_penalty: 0.95
    top_k: 20
    top_p: 0.1
  precise:
    # factual responses and straightforward assistant answers
    temperature: 0.7
    repeat_penalty: 1.176
    top_k: 40
    top_p: 0.1
  qwen-think:
    temperature: 1.0
    presence_penalty: 1.5
    repeat_penalty: 1.0
    min_p: 0.0
    top_p: 0.95
    top_k: 20
    max_tokens: 512
  qwen:
    temperature: 1.0
    presence_penalty: 2.0
    repeat_penalty: 1.0
    min_p: 0.0
    top_p: 1.00
    top_k: 20

chat:
  model: spark-4b
  profile: qwen
task:
  model: gemini-flash-lite
  profile: precise

theme: dark

tools:
  search:
    provider: searxng
    base_url: https://search.codito.in
